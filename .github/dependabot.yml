# Dependabot version updates. Security updates are a separate repository setting (Settings > Advanced
# Security > Dependabot security updates) and are not controlled by this file; see README.md.
#
# Cadence: one weekly batch per ecosystem keeps review to a single sitting. The cooldown holds each new
# release back for a week (two for majors) so a yanked or compromised release is usually caught before it
# reaches a PR. Cooldown does not delay security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      # The framework, its adapter and the Workers toolchain move together and are tested together.
      astro-and-cloudflare:
        patterns: ["astro", "@astrojs/*", "wrangler", "@cloudflare/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: [dependencies]
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
