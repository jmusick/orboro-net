# CI for orboro-net, built from the shared workflows in jmusick/ci: a baseline (secret scan, lockfile
# and dependency checks) and the web-app checks (style, type check, tests, build). This workflow holds
# no deploy credentials and cannot deploy; deployment stays with Cloudflare Workers Builds (a push to
# main runs `npm run build` and `npx wrangler deploy` there). See README.md ("CI") for how to run
# each check locally.
#
# The `CI gate` job is the single result to require in branch rules; it fails when any other job
# fails, is cancelled or is skipped. Dependabot proposes newer jmusick/ci releases through the
# "# vX.Y.Z" comments on the pins below.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: Baseline
    uses: jmusick/ci/.github/workflows/baseline.yml@09fd1dbd09257da5c226e23cfe1409d80e029067 # v0.2.1
    with:
      node-version-file: .nvmrc

  web-app:
    name: Web app
    uses: jmusick/ci/.github/workflows/web-app.yml@09fd1dbd09257da5c226e23cfe1409d80e029067 # v0.2.1
    with:
      node-version-file: .nvmrc
      lint-command: npm run check:styles
      typecheck-command: npm run check
      # `npm test` runs every tests/*.test.* file, so new tests join the gate without workflow edits.
      # The self-test proves the local secret scanner (scripts/scan-secrets.mjs) still flags a synthetic leak.
      test-command: |
        npm test
        npm run scan:secrets:self-test
      build-command: npm run build
      after-build-command: npm run check:inline-scripts

  # The one check to require in branch protection. It passes only when every job above passed, so
  # adding a job never means updating the protection rule.
  gate:
    name: CI gate
    if: always()
    needs: [baseline, web-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
